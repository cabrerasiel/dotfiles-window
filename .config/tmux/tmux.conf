set -g prefix C-b
set -g prefix2 none
bind C-b send-prefix

bind g new-window -n '' "lazygit"

bind q source-file ~/.config/tmux/tmux.conf \; display "Configuration reloaded"

setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

bind -n C-Enter split-window -v -c "#{pane_current_path}"
bind -n C-S-Enter split-window -h -c "#{pane_current_path}"
bind -n C-Escape kill-pane

bind h split-window -v -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"
bind x kill-pane

bind -n C-M-Left select-pane -L
bind -n C-M-Right select-pane -R
bind -n C-M-Up select-pane -U
bind -n C-M-Down select-pane -D

bind -n C-M-S-Left resize-pane -L 5
bind -n C-M-S-Right resize-pane -R 5
bind -n C-M-S-Up resize-pane -U 5
bind -n C-M-S-Down resize-pane -D 5

bind r command-prompt -I "#W" "rename-window --'%%'"
bind c new-window -c "#{pane_current_path}"
bind k kill-window

bind -n C-Left select-window -t -1
bind -n C-Right select-window -t +1
bind -n C-S-Left swap-window -t -1 \; select-window -t -1

bind R command-prompt -I "#S" "rename-session -- '%%'"
bind C new-session -c "#{pane_current_path}"
bind K kill-session
bind P switch-client -p
bind N switch-client -n

bind -n M-Up switch-client -p
bind -n M-Down switch-client -n

bind -r m resize-pane -Z

set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",*:RGB"
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -g escape-time 0
set -g focus-events on
set -g set-clipboard on
set -g allow-passthrough all
setw -g aggressive-resize on
set -g detach-on-destroy off
set -g extended-keys on
set -g extended-keys-format csi-u
set -sg escape-time 10


# STATUS BAR
set -g status-position top
set -g status-interval 5
set -g status-left-length 30
set -g status-right-length 50
set -g window-status-separator ""
set -gw automatic-rename on
set -gw automatic-rename-format '#{b:pane_current_path}'

#THEME — Nord
set -g status-style "bg=#2E3440,fg=#D8DEE9"
set -g status-left ""
set -g status-right "#[fg=#81A1C1,bold] #W "
set -g window-status-format " #[fg=#4C566A]●"
set -g window-status-current-format " #[fg=#81A1C1]●"
set -g window-status-current-style "nobold"
set -g window-status-bell-style "fg=#BF616A,nobold"
set -g pane-border-style "fg=#3B4252"
set -g pane-border-lines simple
set -g pane-active-border-style "fg=#81A1C1"
set -g message-style "bg=#2E3440,fg=#81A1C1"
set -g message-command-style "bg=#2E3440,fg=#81A1C1"
set -g mode-style "bg=#81A1C1,fg=#2E3440"
setw -g clock-mode-colour "#81A1C1"
