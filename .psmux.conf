# psmux config — adaptada de ~/.config/tmux/tmux.conf
# psmux es compatible con sintaxis de tmux

# PREFIX
set -g prefix C-b
set -g prefix2 none
bind C-b send-prefix

# GIT STATUS (background poller — psmux no soporta #() shell substitution)
run-shell -b "pwsh -NoProfile -WindowStyle Hidden -File \"$HOME/.glzr/scripts/psmux-git-status.ps1\""

# SESIÓN DEDICADA A COPILOT
# Se crea (una sola vez, gracias a -A) al arrancar el servidor. "new-session"
# directo en el config no siempre se ejecuta de forma fiable durante el
# arranque, así que se dispara vía run-shell (mismo patrón que el poller de git).
run-shell -b "psmux new-session -A -d -s copilot -n copilot -- pwsh -NoExit -Command copilot"

# Alt+i (sin prefix, funciona desde cualquier sesión/pane): abre un popup
# flotante attachado en vivo a la sesión "copilot", sin salir de la actual.
bind -n M-i display-popup -w 90% -h 90% -E "psmux attach -t copilot"

# LAUNCHERS
bind g display-popup -d "#{pane_current_path}" -w 90% -h 90% -E "lazygit"

# VER OTRA SESIÓN
# prefix+w: choose-tree es un comando interno (como copy-mode), no un programa;
# necesita el cliente ya conectado, por eso NO se puede meter en display-popup
# (se cerraría al instante). Se ejecuta directo y ya se muestra como overlay.
bind w choose-tree
# prefix+S: pide el nombre de la sesión y la attachea en popup flotante
# (esto sí funciona en popup porque "attach" sí es un proceso real e interactivo)
bind S command-prompt -p "sesión:" "display-popup -w 90% -h 90% -E 'psmux attach -t \"%%\"'"

# RELOAD
bind q source-file ~/.psmux.conf \; display "Configuration reloaded"

# MODE VI
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# PANE SPLITS (Ctrl+Enter / Ctrl+Shift+Enter)
bind -n C-Enter split-window -v -c "#{pane_current_path}"
bind -n C-S-Enter split-window -h -c "#{pane_current_path}"
bind -n C-Escape kill-pane

# PANE SPLITS (prefix h/v)
bind h split-window -v -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"
bind x kill-pane

# PANE NAVEGACIÓN (Ctrl+Alt + flechas)
# Integración con nvim (vim-tmux-navigator): si el pane activo corre vim/nvim,
# reenvía la tecla para que nvim mueva el split; si no, psmux cambia de pane.
bind -n C-M-Left if-shell -F "#{m:*vim*,#{pane_current_command}}" "send-keys C-M-Left" "select-pane -L"
bind -n C-M-Right if-shell -F "#{m:*vim*,#{pane_current_command}}" "send-keys C-M-Right" "select-pane -R"
bind -n C-M-Up if-shell -F "#{m:*vim*,#{pane_current_command}}" "send-keys C-M-Up" "select-pane -U"
bind -n C-M-Down if-shell -F "#{m:*vim*,#{pane_current_command}}" "send-keys C-M-Down" "select-pane -D"

# PANE RESIZE (Ctrl+Alt+Shift + flechas)
bind -n C-M-S-Left resize-pane -L 5
bind -n C-M-S-Right resize-pane -R 5
bind -n C-M-S-Up resize-pane -U 5
bind -n C-M-S-Down resize-pane -D 5

# WINDOWS
bind r command-prompt -I "#W" "rename-window --'%%'"
bind c new-window -c "#{pane_current_path}"
bind k kill-window

bind -n C-Left select-window -t -1
bind -n C-Right select-window -t +1
bind -n C-S-Left swap-window -t -1 \; select-window -t -1

# SESSIONS
bind R command-prompt -I "#S" "rename-session -- '%%'"
bind C new-session -c "#{pane_current_path}"
bind K kill-session
bind P switch-client -p
bind N switch-client -n

bind -n M-Up switch-client -p
bind -n M-Down switch-client -n

bind -r m resize-pane -Z

# OPCIONES GENERALES
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -g set-clipboard on
setw -g aggressive-resize on
set -g detach-on-destroy off

# STATUS BAR
set -g status-position top
set -g status-interval 5
set -g status-left-length 40
set -g status-right-length 80
set -g window-status-separator ""
set -gw automatic-rename on
set -gw automatic-rename-format '#{b:pane_current_path}'

# THEME — Retro 82 (misma paleta que Alacritty/Neovim)
# Colores en minúsculas: psmux interpreta "#F", "#S", "#W", "#P", "#T", "#D",
# "#H" como variables de formato (window_flags, session_name, etc.), así que
# un hex en mayúsculas que empiece con esas letras (p.ej. #FFF1DA) se corrompe.
# bg #00172e, fg #fff1da, accent (workspace) #3f8f8a, git #028391, cmd #e97b3c, dirty #f85525
set -g status-style "bg=#00172e,fg=#fff1da"

# Izquierda: nombre de la sesión (equivalente al "workspace" de WezTerm) con flecha
set -g status-left "#[bg=#faa968,fg=#00172e,bold] #S #[bg=#00172e,fg=#faa968,nobold] #[default]"

# Derecha: comando activo / carpeta actual / rama git (si existe)
set -g status-right "#[fg=#3f8f8a]  #[fg=#fff1da,bold]#{pane_current_command}#[nobold] #[fg=#3f8f8a]  /  #[fg=#fff1da]󰉋  #{b:pane_current_path} #{?PSMUX_GIT_BRANCH,#[fg=#3f8f8a]  /  #[fg=#028391]  #{PSMUX_GIT_BRANCH}#{?#{==:#{PSMUX_GIT_CHANGES},0},,#[fg=#e97b3c]  ● #{PSMUX_GIT_CHANGES}},}  "

set -g window-status-format " #[fg=#3f8f8a,bold]●#[nobold]"
set -g window-status-current-format " #[fg=#f85525,bold]●#[nobold]"
set -g window-status-current-style "nobold"
set -g window-status-bell-style "fg=#f85525,nobold"
set -g pane-border-style "fg=#5f8f96"
set -g pane-active-border-style "fg=#3f8f8a"
set -g message-style "bg=#00172e,fg=#3f8f8a"
set -g message-command-style "bg=#00172e,fg=#3f8f8a"
set -g mode-style "bg=#3f8f8a,fg=#00172e"
setw -g clock-mode-colour "#3f8f8a"
