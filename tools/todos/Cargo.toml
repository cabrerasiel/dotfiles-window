[package]
name = "todos"
version = "0.1.0"
edition = "2024"

[dependencies]
color-eyre = "0.6.5"
crossterm = "0.29.0"
ratatui = { version = "0.30.2", features = ["all-widgets"] }
serde = { version = "1.0.229", features = ["derive"]}
serde_json = "1.0.151"
uuid = { version = "1.26.1", features = ["v4", "serde"] }
clap = { version = "4.5", features = ["derive"] }
eventkit-rs = { version = "0.5.6", default-features = false, features = ["events", "reminders"] }
chrono = { version = "0.4", features = ["clock"] }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "query", "rustls", "rustls-native-certs"] }
dotenvy = "0.15"
dirs = "7.0"
